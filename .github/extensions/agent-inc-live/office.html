<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent Inc · Live Office</title>
    <link rel="stylesheet" href="/office.css">
    <script src="/office.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div class="brand"><span class="brand-mark">✦</span><span>agent inc<span class="brand-dot">.</span></span><small>LIVE OFFICE / EXPERIMENT</small></div>
        <div class="summary"><span class="live-light"></span><span id="summary">Connecting to this session…</span></div>
      </header>
      <section class="office" aria-label="Live Copilot session office">
        <div class="wall">
          <div class="wall-sign">THE WORKROOM <span>✳</span></div>
          <div class="windows"><div class="window"></div><div class="window"></div><div class="window"></div></div>
          <div class="shelf"><span>●</span><span>●</span><span>●</span><span>●</span></div>
        </div>
        <div class="sunbeam beam-one"></div><div class="sunbeam beam-two"></div>
        <div class="floor"></div>
        <div class="floor-shade"></div>
        <div class="plant plant-left"><span>✦</span></div>
        <div class="plant plant-right"><span>✦</span></div>
        <div id="stations" class="stations"></div>
        <div class="coffee">
          <div class="coffee-label">COFFEE &amp; IDLE</div>
          <div class="counter"><span class="mug">▣</span><span class="counter-line"></span><span class="mug">▣</span></div>
          <div id="coffee-workers" class="coffee-workers"></div>
        </div>
        <div class="room-caption">REAL SESSIONS · READ-ONLY · LOCAL TO THIS MACHINE</div>
      </section>
      <section class="dashboard" aria-label="Session details">
        <div class="dashboard-title"><span>◆</span> ACTIVE SIGNALS <span id="count" class="count">0</span></div>
        <p id="connection" class="connection">Connecting…</p>
        <div id="roster" class="roster"></div>
      </section>
      <footer>STATUS ONLY · NO PROMPTS, CODE OR TOOL OUTPUT SHARED <span>AGENT INC / LIVE TEST</span></footer>
    </main>
  </body>
</html>
